plugins {
    id "com.android.application"
}
android {
    namespace "com.ranova.vpn.standalone"
    compileSdk 35

    defaultConfig {
        applicationId "com.ranova.vpn.standalone"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1-standalone-test"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "io.github.tim06:openvpn:1.0.13"
    implementation "io.github.tim06:basevpnprotocols:1.0.13"
    implementation "io.github.tim06:vpnprotocolsnotification:1.0.13"
}
