name: Build RANOVA VPN Android connection test

on:
  workflow_dispatch:
  push:
    paths:
      - "android-test/**"
      - ".github/workflows/build-android-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK 35
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p android-test :app:assembleDebug --stacktrace

      - name: Verify APK signature and checksum
        shell: bash
        run: |
          APK="android-test/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee android-test/APK-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RANOVA-VPN-Connection-Test
          path: |
            android-test/app/build/outputs/apk/debug/app-debug.apk
            android-test/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 14
