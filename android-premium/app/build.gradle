plugins {
    id "com.android.application"
}
android {
    namespace "com.ranova.vpnpro.beta"
    compileSdk 35
    defaultConfig {
        applicationId "com.ranova.vpnpro.beta"
        minSdk 28
        targetSdk 35
        versionCode 8
        versionName "0.8-sticky-header-password-eye"
    }
    buildFeatures {
        aidl true
        buildConfig false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation "io.github.tim06:openvpn:1.1.3"
    implementation "io.github.tim06:basevpnprotocols:1.1.1"
}
